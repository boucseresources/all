site_name: Bou CSE Resources
# site_url: https://boucseresources.github.io/
site_url: "https://notes.bro.bd/"
docs_dir: docs # if missing, default is 'docs'

theme:
  name: material
  custom_dir: overrides
  font:
    text: Noto Serif Bengali
    code: Roboto Mono
  logo: assets/bou-notes-logo.png
  favicon: assets/bou-notes-logo.png
  icon:
    annotation: material/star-four-points-circle
  features:
    - navigation.instant.prefetch
    - navigation.instant.progress
    - search.share
    - content.code.annotate
    - content.tooltips
    - navigation.instant
    - search.suggest
    - search.highlight
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - navigation.top
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      primary: black
      accent: yellow

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: white
      accent: pink

plugins:
  - search
  - social
  - privacy:
      # Exclude problematic URLs from being cached locally by the privacy plugin
  - meta
  - glightbox
  - obsidian-bridge
  - awesome-pages
  - mcq
  - toggle-sidebar

extra:
  generator: false
  announcement:
    type: info
    text: |
      🚀 Welcome to the new version of the docs! Check out the [changelog](index.md).
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/rakibulhashanrabbi/
  analytics:
    provider: google
    property: G-L5PLKJC0BE
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            using our <a href="..." target="_blank" rel="noopener">feedback form</a>.
  meta:
    - name: google-site-verification
      content: 2DzSK5YqtUmF6BuC8wVWanf-j8tYFIEKnuQPi6Vkq0o
    - name: description
      content: "Free CSE study materials for Bangladesh Open University students."
    - name: keywords
      content: "bou admission, bou cse admission, bou cse admission circular, bou cse, bou cse resources, bangladesh open university, bou sst"

markdown_extensions:
  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference
  - abbr
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.keys
  - pymdownx.inlinehilite
  - markdown.extensions.nl2br
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

extra_javascript:
  - meta-inject.js
  - javascripts/mathjax/mathjax.js
  - javascripts/mathjax/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/custom_buttons.css

copyright: Copyright &copy; 2026 Rakibul Hashan
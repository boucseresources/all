        Sequence</text>
<line x1="435" y1="330" x2="235" y2="330"
    stroke="#475569" stroke-width="2"/><text x="335" y="323"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Flags</text>
<line x1="530" y1="280" x2="575" y2="190"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="552.5" y="228"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Next address</text>
<line x1="805" y1="380" x2="805" y2="420"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/></g>
  
</svg>
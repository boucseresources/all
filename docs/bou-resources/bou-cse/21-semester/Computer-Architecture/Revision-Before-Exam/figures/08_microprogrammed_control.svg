<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="510"
  viewBox="0 0 1050 510" role="img" aria-labelledby="title desc">
  <title id="title">Microprogrammed Control Unit</title>
  <desc id="desc">Microprogrammed Control Unit</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="525" y="32" text-anchor="middle" font-size="21"
    font-weight="700" fill="#0f172a">Microprogrammed Control Unit</text>
  <g filter="url(#shadow)">
    <rect x="45" y="105" width="160" height="85" rx="10"
      fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
    <text x="125" y="152.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Opcode in IR</text>

    <rect x="255" y="105" width="180" height="85" rx="10"
      fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="345" y="143"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Mapping /</text>
<text x="345" y="162"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Dispatch Logic</text>

    <rect x="485" y="105" width="180" height="85" rx="10"
      fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="575" y="143"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Control Address</text>
<text x="575" y="162"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Register</text>

    <rect x="715" y="105" width="180" height="85" rx="10"
      fill="#dbeafe" stroke="#334155" stroke-width="2"/>
    <text x="805" y="152.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Control Memory</text>

    <rect x="715" y="280" width="180" height="100" rx="10"
      fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="805" y="325.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Microinstruction</text>
<text x="805" y="344.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Register</text>

    <rect x="435" y="280" width="190" height="100" rx="10"

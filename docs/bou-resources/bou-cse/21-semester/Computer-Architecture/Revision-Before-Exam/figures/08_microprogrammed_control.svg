    <text x="530" y="325.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Next-Address /</text>
<text x="530" y="344.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Condition Logic</text>

    <rect x="45" y="290" width="190" height="75" rx="10"
      fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="140" y="332.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Condition Flags</text>

    <rect x="715" y="420" width="180" height="55" rx="10"
      fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
    <text x="805" y="452.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Datapath Signals</text></g>
  <g><line x1="205" y1="147" x2="255" y2="147"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="435" y1="147" x2="485" y2="147"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="665" y1="147" x2="715" y2="147"

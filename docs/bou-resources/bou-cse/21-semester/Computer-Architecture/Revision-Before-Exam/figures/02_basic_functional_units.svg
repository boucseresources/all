<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430"
  viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Basic Functional Units of a Computer</title>
  <desc id="desc">Basic Functional Units of a Computer</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="490" y="32" text-anchor="middle" font-size="21"
    font-weight="700" fill="#0f172a">Basic Functional Units of a Computer</text>
  <g filter="url(#shadow)">
    <rect x="45" y="170" width="155" height="80" rx="10"
      fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
    <text x="122.5" y="215"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Input Unit</text>

    <rect x="275" y="145" width="200" height="130" rx="10"
      fill="#eef2ff" stroke="#334155" stroke-width="2"/>
    <text x="375" y="205.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Main Memory</text>
<text x="375" y="224.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Instructions + Data</text>

    <rect x="555" y="115" width="235" height="190" rx="10"
      fill="#dbeafe" stroke="#334155" stroke-width="2"/>
    <text x="672.5" y="186.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">CPU</text>
<text x="672.5" y="205.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Register File</text>
<text x="672.5" y="224.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">ALU</text>
<text x="672.5" y="243.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Control Unit</text>

    <rect x="830" y="170" width="110" height="80" rx="10"
      fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
    <text x="885" y="205.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Output</text>
<text x="885" y="224.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Unit</text>

    <rect x="555" y="335" width="235" height="55" rx="10"
      fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="672.5" y="367.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">I/O Controllers</text></g>
  <g><line x1="200" y1="210" x2="275" y2="210"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="237.5" y="203"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Data</text>
<line x1="475" y1="190" x2="555" y2="190"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="183"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Instructions</text>
<line x1="555" y1="245" x2="475" y2="245"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="238"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Results</text>
<line x1="790" y1="210" x2="830" y2="210"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="675" y1="305" x2="675" y2="335"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/></g>
  
</svg>
#   branch: main                   # <— change if needed

# Optional: safer workflow = PRs for review
publish_mode: editorial_workflow

# Where uploads go (inside your repo)
media_folder: "docs/assets/uploads"
public_folder: "/assets/uploads"
local_backend: true
backend: { name: git-gateway }


collections:
  - name: pages
    label: All Pages
    folder: "docs"
    create: true
    extension: "md"
    # Keep nested folder structure when creating new files:
    path: "{{dirname}}/{{slug}}.md"
    # (Optional) Helps Decap understand subfolders better:
    nested:
      depth: 100
    # Show something readable in the list (title + filename fallback feel):
    summary: "{{title}} — {{filename}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body",  name: "body",  widget: "markdown" }
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="530"
  viewBox="0 0 1060 530" role="img" aria-labelledby="title desc">
  <title id="title">Internal Organization of a Memory Chip</title>
  <desc id="desc">Internal Organization of a Memory Chip</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="530" y="32" text-anchor="middle" font-size="21"
    font-weight="700" fill="#0f172a">Internal Organization of a Memory Chip</text>
  <g filter="url(#shadow)">
    <rect x="45" y="115" width="150" height="85" rx="10"
      fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
    <text x="120" y="162.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Address</text>

    <rect x="260" y="80" width="180" height="110" rx="10"
      fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="350" y="140"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Row Decoder</text>

    <rect x="505" y="70" width="230" height="220" rx="10"
      fill="#eef2ff" stroke="#334155" stroke-width="2"/>
    <text x="620" y="175.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Bit-Cell Array</text>
<text x="620" y="194.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Word Lines × Bit Lines</text>

    <rect x="260" y="285" width="180" height="110" rx="10"
      fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="350" y="335.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Column Decoder</text>
<text x="350" y="354.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">and MUX</text>

    <rect x="505" y="345" width="230" height="105" rx="10"
      fill="#dbeafe" stroke="#334155" stroke-width="2"/>
    <text x="620" y="393"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Sense Amplifiers</text>
<text x="620" y="412"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">and Write Drivers</text>

    <rect x="825" y="345" width="180" height="105" rx="10"
      fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="915" y="402.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Data I/O</text>

    <rect x="45" y="330" width="150" height="75" rx="10"
      fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="120" y="363"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Chip Enable</text>
<text x="120" y="382"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Read / Write</text></g>
  <g><line x1="195" y1="145" x2="260" y2="135"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="440" y1="135" x2="505" y2="135"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="195" y1="165" x2="260" y2="330"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="227.5" y="240.5"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Column bits</text>
<line x1="440" y1="340" x2="505" y2="395"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="620" y1="290" x2="620" y2="345"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="620" y="310.5"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Bit lines</text>
<line x1="735" y1="397" x2="825" y2="397"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="195" y1="367" x2="505" y2="430"
    stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="350" y="391.5"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Control</text></g>
  
</svg>
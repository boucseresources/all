        Data</text>
<line x1="715" y1="380" x2="240" y2="380"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="477.5" y="373"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Address</text>
<line x1="522" y1="500" x2="522" y2="245"
    stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="580" y="390"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Control</text></g>
  
</svg>
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">SIMD</text>
<text x="405" y="330"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">1 Instruction</text>
<text x="405" y="349"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Many Data</text>

    <rect x="555" y="270" width="200" height="110" rx="10"

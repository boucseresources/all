    <text x="155" y="311"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">SISD</text>
<text x="155" y="330"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">1 Instruction</text>
<text x="155" y="349"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">1 Data</text>

    <rect x="305" y="270" width="200" height="110" rx="10"

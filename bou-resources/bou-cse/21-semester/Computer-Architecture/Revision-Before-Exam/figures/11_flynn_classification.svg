<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="480"
  viewBox="0 0 1050 480" role="img" aria-labelledby="title desc">
  <title id="title">Flynn’s Classification</title>
  <desc id="desc">Flynn’s Classification</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"

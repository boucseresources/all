<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520"
  viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Sequential Shift-and-Add Multiplier</title>
  <desc id="desc">Sequential Shift-and-Add Multiplier</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="21"
    font-weight="700" fill="#0f172a">Sequential Shift-and-Add Multiplier</text>
  <g filter="url(#shadow)">
    <rect x="55" y="90" width="220" height="90" rx="10"
      fill="#eef2ff" stroke="#334155" stroke-width="2"/>
    <text x="165" y="130.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Multiplicand Register</text>
<text x="165" y="149.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Left Shift</text>

    <rect x="370" y="100" width="190" height="80" rx="10"
      fill="#dbeafe" stroke="#334155" stroke-width="2"/>
    <text x="465" y="145"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">2n-bit Adder</text>

    <rect x="660" y="90" width="230" height="90" rx="10"
      fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="775" y="130.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Product Register</text>
<text x="775" y="149.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Partial Sum</text>

    <rect x="55" y="285" width="220" height="90" rx="10"
      fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="165" y="325.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Multiplier Register</text>
<text x="165" y="344.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Right Shift</text>

    <rect x="370" y="285" width="190" height="90" rx="10"
      fill="#fff7ed" stroke="#334155" stroke-width="2"/>
    <text x="465" y="325.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Control and Counter</text>
<text x="465" y="344.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Test Q₀</text></g>
  <g><line x1="275" y1="135" x2="370" y2="135"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="560" y1="135" x2="660" y2="135"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="660" y1="165" x2="560" y2="165"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="610" y="158"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Feedback</text>
<line x1="275" y1="330" x2="370" y2="330"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="322.5" y="323"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Q₀</text>
<line x1="465" y1="285" x2="465" y2="180"
    stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="465" y="225.5"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Add enable</text>
<line x1="370" y1="350" x2="275" y2="350"
    stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="322.5" y="343"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Shift</text>
<line x1="370" y1="310" x2="275" y2="160"
    stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="322.5" y="228"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Shift</text></g>
  
</svg>
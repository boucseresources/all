<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480"
  viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Basic Processor–Memory Connection</title>
  <desc id="desc">Basic Processor–Memory Connection</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="21"
    font-weight="700" fill="#0f172a">Basic Processor–Memory Connection</text>
  <g filter="url(#shadow)">
    <rect x="55" y="145" width="200" height="160" rx="10"
      fill="#dbeafe" stroke="#334155" stroke-width="2"/>
    <text x="155" y="211"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Processor</text>
<text x="155" y="230"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">CPU / Cache</text>
<text x="155" y="249"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Controller</text>

    <rect x="385" y="65" width="190" height="80" rx="10"
      fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="480" y="100.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">MAR</text>
<text x="480" y="119.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Address Latch</text>

    <rect x="385" y="195" width="190" height="80" rx="10"
      fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="480" y="230.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">MDR</text>
<text x="480" y="249.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Data Buffer</text>

    <rect x="385" y="325" width="190" height="80" rx="10"
      fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="480" y="370"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Control Logic</text>

    <rect x="745" y="145" width="200" height="160" rx="10"
      fill="#eef2ff" stroke="#334155" stroke-width="2"/>
    <text x="845" y="220.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Memory System</text>
<text x="845" y="239.5"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">SRAM / DRAM</text></g>
  <g><line x1="255" y1="185" x2="385" y2="105"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="575" y1="105" x2="745" y2="175"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="660" y="133"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Address bus</text>
<line x1="255" y1="225" x2="385" y2="235"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="575" y1="235" x2="745" y2="235"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="660" y="228"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Data bus</text>
<line x1="255" y1="270" x2="385" y2="365"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="575" y1="365" x2="745" y2="280"
    stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="660" y="315.5"
        text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">
        Read • Write • Ready</text></g>
  
</svg>
      fill="#0f172a">Application Programs</text>
<text x="380" y="102"
      text-anchor="middle" font-size="15" font-weight="600"
      fill="#0f172a">Browser • Database • Editor</text>

    <rect x="180" y="145" width="400" height="65" rx="10"

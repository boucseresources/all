<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760"
  viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">Layers of Computer System Architecture</title>
  <desc id="desc">Layers of Computer System Architecture</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="21"
    font-weight="700" fill="#0f172a">Layers of Computer System Architecture</text>
  <g filter="url(#shadow)">
    <rect x="180" y="55" width="400" height="65" rx="10"
